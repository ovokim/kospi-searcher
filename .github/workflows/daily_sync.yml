name: Daily KOSPI Quant Sync

on:
  schedule:
    # 평일(월~금) 한국시간 오후 4시 30분 자동 실행 (UTC 07:30)
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 언제든 수동 실행 가능 버튼 생성

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run Collector
        run: node sync_all.js

      - name: Commit and Push Updated Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add kospi_cache.json
          git diff --staged --quiet || (git commit -m "chore: auto sync kospi quant data [skip ci]" && git push)